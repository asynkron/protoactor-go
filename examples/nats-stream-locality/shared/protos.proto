syntax = "proto3";
package shared;
option go_package = "github.com/asynkron/protoactor-go/examples/nats-stream-locality/shared";

message SensorReading {
  string sensor_id = 1;
  string subject = 2;
  double value = 3;
  int64 timestamp = 4;
}

message Ack {}

service Sensor {
  rpc HandleReading (SensorReading) returns (Ack) {}
}
